<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .blinking {
            animation: blinker 1.5s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
<!-- TopAppBar -->
<header class="bg-surface border-b-4 border-surface-variant flex justify-between items-center w-full px-gutter py-stack-md shrink-0">
<div><img src="/grow%20c.png" alt="Grow C" class="h-12 object-contain"/></div>
<div class="flex items-center gap-stack-md">
<span class="font-headline-lg text-headline-lg text-primary">ORDER STATUS</span>
<div class="flex gap-stack-sm text-on-surface-variant">
<a class="material-symbols-outlined" href="/admin.html" style="font-variation-settings: 'FILL' 0; text-decoration: none;" title="Admin panel">settings</a>
<span class="material-symbols-outlined cursor-pointer" id="fullscreen-btn" style="font-variation-settings: 'FILL' 0;" title="Fullscreen">fullscreen</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex w-full p-gutter gap-gutter h-full overflow-hidden mb-12">
<!-- Preparing Section (Left Column) -->
<section class="w-1/2 bg-surface-container-low flex flex-col border-4 border-outline-variant rounded-xl overflow-hidden">
<div class="bg-surface-variant p-stack-md border-b-4 border-outline-variant">
<h2 class="font-headline-lg text-headline-lg text-on-surface text-center uppercase">Pesanan Disiapkan</h2>
<div class="font-label-sm text-label-sm text-on-surface-variant text-center mt-stack-sm uppercase tracking-widest">SEDANG DISIAPKAN</div>
</div>
<div class="p-stack-lg flex-1 overflow-y-auto">
<div class="grid grid-cols-2 gap-stack-lg" id="preparing-grid"></div>
</div>
</section>
<!-- Right Column -->
<div class="w-1/2 flex flex-col gap-gutter">
<!-- Ready Section (Top Right) -->
<section class="flex-1 bg-primary-container flex flex-col border-4 border-primary rounded-xl overflow-hidden">
<div class="bg-primary p-stack-md border-b-4 border-on-primary">
<h2 class="font-headline-lg text-headline-lg text-on-primary text-center uppercase">Pesanan Siap Diambil</h2>
<div class="font-label-sm text-label-sm text-on-primary text-center mt-stack-sm uppercase tracking-widest">SUDAH BISA DIAMBIL</div>
</div>
<div class="p-stack-lg flex-1 flex justify-center items-center gap-stack-lg flex-wrap overflow-y-auto" id="ready-grid"></div>
</section>
<!-- Video Loop Section (Bottom Right) -->
<section class="flex-1 bg-surface-container flex flex-col items-center justify-center border-4 border-surface-variant rounded-xl overflow-hidden relative">
<video id="video-loop" class="absolute inset-0 w-full h-full object-cover hidden" autoplay playsinline></video>
<div id="video-placeholder" class="z-10 flex flex-col items-center gap-stack-md text-on-surface-variant">
<span class="material-symbols-outlined text-[64px]" style="font-variation-settings: 'FILL' 1;">play_circle</span>
<span class="font-headline-md tracking-widest uppercase">Video Loop</span>
</div>
<button id="unmute-btn" class="hidden absolute bottom-4 right-4 z-20 flex items-center gap-2 bg-black/70 hover:bg-black/90 text-white px-4 py-2 rounded-full border border-white/30">
<span class="material-symbols-outlined">volume_off</span>
<span class="font-label-sm text-label-sm uppercase tracking-widest">Aktifkan Suara</span>
</button>
</section>
</div>
</main>
<!-- Footer -->
<footer class="fixed bottom-0 w-full flex justify-between items-center px-gutter py-base bg-surface-container-lowest z-10 shrink-0 border-t-2 border-surface-variant">
<div class="font-label-sm text-label-sm text-secondary uppercase tracking-widest" id="system-status">
            SYSTEM STATUS: OPTIMAL | STATION ID: FOH-01
        </div>
<div class="font-label-sm text-label-sm text-secondary uppercase tracking-widest" id="clock">
            --:--:--
        </div>
</footer>
<script>
        // Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('id-ID', { hour12: false });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Fullscreen toggle
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        function updateFullscreenIcon() {
            fullscreenBtn.textContent = document.fullscreenElement ? 'fullscreen_exit' : 'fullscreen';
        }
        fullscreenBtn.addEventListener('click', () => {
            if (document.fullscreenElement) {
                document.exitFullscreen();
            } else {
                document.documentElement.requestFullscreen().catch((err) => {
                    console.error('Failed to enter fullscreen:', err);
                });
            }
        });
        document.addEventListener('fullscreenchange', updateFullscreenIcon);

        // Order polling
        const preparingGrid = document.getElementById('preparing-grid');
        const readyGrid = document.getElementById('ready-grid');
        const systemStatus = document.getElementById('system-status');
        const POLL_MS = 3000;

        // Track which orders have already been announced, persisted across
        // page reloads so a refresh never causes a missed or repeated announcement.
        const ANNOUNCED_KEY = 'announcedReadyOrderIds';
        function loadAnnouncedIds() {
            try {
                return new Set(JSON.parse(localStorage.getItem(ANNOUNCED_KEY) || '[]'));
            } catch {
                return new Set();
            }
        }
        function saveAnnouncedIds(set) {
            // Keep it from growing forever across days of usage.
            const trimmed = Array.from(set).slice(-500);
            localStorage.setItem(ANNOUNCED_KEY, JSON.stringify(trimmed));
        }
        const TTS_INITIALIZED_KEY = 'ttsInitialized';
        let announcedIds = loadAnnouncedIds();
        let lastReadyIds = new Set();
        let firstPoll = true;
        // True only the very first time this screen is ever opened (empty
        // localStorage) — not on every page refresh — so pre-existing ready
        // orders aren't all read aloud at once, but a reload never suppresses
        // a genuinely new announcement.
        let isFirstEverRun = localStorage.getItem(TTS_INITIALIZED_KEY) !== '1';

        function preparingCard(order) {
            const div = document.createElement('div');
            div.className = 'font-display-lg text-display-lg text-on-surface text-center py-stack-sm bg-surface border-2 border-outline-variant rounded';
            div.textContent = order.number;
            return div;
        }

        function readyCard(order, isNew) {
            const div = document.createElement('div');
            div.className = 'font-[Anton] text-[120px] leading-[1] text-secondary text-center px-4' + (isNew ? ' blinking' : '');
            div.textContent = order.number;
            return div;
        }

        // Text-to-speech announcement when an order becomes ready
        let ttsVoice = null;
        function pickIndonesianVoice() {
            const voices = speechSynthesis.getVoices();
            ttsVoice = voices.find((v) => v.lang === 'id-ID') ||
                voices.find((v) => v.lang && v.lang.startsWith('id')) ||
                null;
        }
        pickIndonesianVoice();
        if ('onvoiceschanged' in speechSynthesis) {
            speechSynthesis.onvoiceschanged = pickIndonesianVoice;
        }

        function announceReady(number) {
            const utterance = new SpeechSynthesisUtterance(`Nomor pesanan ${number} sudah siap`);
            utterance.lang = 'id-ID';
            if (ttsVoice) utterance.voice = ttsVoice;
            utterance.rate = 0.95;
            utterance.volume = 1;

            const video = document.getElementById('video-loop');
            const videoWasPlaying = video && !video.paused && !video.muted;
            const originalVolume = video ? video.volume : 1;

            utterance.onstart = () => {
                if (videoWasPlaying) video.volume = 0; // fully silence video so the announcement dominates
            };
            utterance.onend = utterance.onerror = () => {
                if (videoWasPlaying) setTimeout(() => { video.volume = originalVolume; }, 400);
            };

            console.log('[TTS] announcing:', utterance.text);
            speechSynthesis.speak(utterance);
        }

        async function refreshOrders() {
            try {
                const res = await fetch('/api/orders');
                if (!res.ok) throw new Error('bad response');
                const orders = await res.json();

                const preparing = orders.filter((o) => o.status === 'preparing');
                const ready = orders.filter((o) => o.status === 'ready');

                preparingGrid.innerHTML = '';
                preparing.forEach((o) => preparingGrid.appendChild(preparingCard(o)));

                const currentReadyIds = new Set(ready.map((o) => o.id));
                readyGrid.innerHTML = '';
                ready.forEach((o) => {
                    const isNew = !lastReadyIds.has(o.id) && !firstPoll;
                    readyGrid.appendChild(readyCard(o, isNew));
                });
                lastReadyIds = currentReadyIds;

                // Announce any order that just entered "ready" (i.e. wasn't
                // already-ready-and-announced last time we checked). Orders
                // that leave "ready" (reverted, picked up) are dropped from
                // announcedIds, so if they become ready again later they get
                // announced again too.
                const unannounced = ready.filter((o) => !announcedIds.has(o.id));
                if (unannounced.length && !isFirstEverRun) {
                    unannounced.forEach((o) => announceReady(o.number));
                }
                announcedIds = currentReadyIds;
                saveAnnouncedIds(announcedIds);
                if (isFirstEverRun) {
                    isFirstEverRun = false;
                    localStorage.setItem(TTS_INITIALIZED_KEY, '1');
                }
                firstPoll = false;

                systemStatus.textContent = 'SYSTEM STATUS: OPTIMAL | STATION ID: FOH-01';
            } catch (err) {
                systemStatus.textContent = 'SYSTEM STATUS: OFFLINE | RETRYING...';
            }
        }

        refreshOrders();
        setInterval(refreshOrders, POLL_MS);

        // Some browsers require a user gesture before speechSynthesis will
        // actually produce sound. Unlock it on the first tap/click anywhere.
        function unlockSpeech() {
            const warmup = new SpeechSynthesisUtterance(' ');
            speechSynthesis.speak(warmup);
            document.removeEventListener('click', unlockSpeech);
        }
        document.addEventListener('click', unlockSpeech, { once: true });

        // Video loop: playlist fetched from ERPNext (via our server cache) and
        // additionally cached in the browser's Cache Storage so playback keeps
        // working smoothly even on flaky network.
        const videoEl = document.getElementById('video-loop');
        const videoPlaceholder = document.getElementById('video-placeholder');
        const unmuteBtn = document.getElementById('unmute-btn');
        const VIDEO_CACHE_NAME = 'order-monitor-videos-v1';
        const VIDEO_REFRESH_MS = 5 * 60 * 1000;

        let playlist = []; // [{ id, url, blobUrl }]
        let currentIndex = 0;

        unmuteBtn.addEventListener('click', () => {
            videoEl.muted = false;
            videoEl.play().catch(() => {});
            unmuteBtn.classList.add('hidden');
        });

        async function getCachedBlobUrl(url) {
            const cache = await caches.open(VIDEO_CACHE_NAME);
            let response = await cache.match(url);
            if (!response) {
                const fetched = await fetch(url);
                if (!fetched.ok) throw new Error('failed to fetch video ' + url);
                await cache.put(url, fetched.clone());
                response = fetched;
            }
            const blob = await response.blob();
            return URL.createObjectURL(blob);
        }

        function playAt(index) {
            if (!playlist.length) return;
            currentIndex = index % playlist.length;
            videoEl.src = playlist[currentIndex].blobUrl;
            videoEl.muted = false;
            videoEl.play().catch(() => {
                // Autoplay-with-sound blocked by the browser: fall back to muted
                // playback and let the user opt in to sound with one click.
                videoEl.muted = true;
                videoEl.play().catch(() => {});
                unmuteBtn.classList.remove('hidden');
            });
        }

        videoEl.addEventListener('ended', () => playAt(currentIndex + 1));

        async function refreshVideoPlaylist() {
            try {
                const res = await fetch('/api/videos');
                if (!res.ok) throw new Error('bad response');
                const videos = await res.json();

                if (!videos.length) {
                    playlist = [];
                    videoEl.pause();
                    videoEl.removeAttribute('src');
                    videoEl.classList.add('hidden');
                    videoPlaceholder.classList.remove('hidden');
                    return;
                }

                const sameIds = playlist.length === videos.length &&
                    playlist.every((v, i) => v.id === videos[i].id);
                if (sameIds) return; // nothing changed, keep playing uninterrupted

                const wasPlayingId = playlist[currentIndex] ? playlist[currentIndex].id : null;
                const next = [];
                for (const v of videos) {
                    try {
                        const blobUrl = await getCachedBlobUrl(v.url);
                        next.push({ id: v.id, url: v.url, blobUrl });
                    } catch (err) {
                        console.error('Failed to cache video', v.url, err);
                    }
                }
                if (!next.length) return;

                playlist = next;
                videoPlaceholder.classList.add('hidden');
                videoEl.classList.remove('hidden');

                const resumeIndex = playlist.findIndex((v) => v.id === wasPlayingId);
                playAt(resumeIndex >= 0 ? resumeIndex : 0);
            } catch (err) {
                console.error('Failed to refresh video playlist', err);
            }
        }

        refreshVideoPlaylist();
        setInterval(refreshVideoPlaylist, VIDEO_REFRESH_MS);
    </script>
</body></html>
